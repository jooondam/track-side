[project]
name = "track-side"
version = "0.1.0"
description = "Ideal racing line optimizer: min-curvature and min-time trajectory planning on real circuit geometry."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
reference = ["casadi"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["offline"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["offline*"]
